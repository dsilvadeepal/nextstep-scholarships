[project]
name = "nextstep-scholarships"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]
[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "httpx2>=2.13.1",
]
[tool.pytest.ini_options]
pythonpath = ["backend"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/nextstep"]
