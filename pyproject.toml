[project]
name = "nextstep-scholarships"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.20.1",
    "pdfplumber>=0.11.10",
    "langchain-core>=1.6.10",
    "langchain-text-splitters>=1.1.3",
    "tiktoken>=0.14.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "authlib>=1.9.1",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "replit-object-storage>=1.0.2",
    "langchain-openai>=1.7.2",
    "pinecone>=10.0.0",
]
[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "httpx2>=2.13.1",
    "ruff>=0.17.0",
]
[tool.pytest.ini_options]
pythonpath = ["backend"]
markers = ["postgres: requires a configured disposable PostgreSQL database"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/nextstep"]
